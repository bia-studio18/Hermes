[package]
name = "hermes-rust"
version = "0.1.0"
edition = "2024"

[lib]
name = "_rust"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "hermes"
path = "src/bin/hermes.rs"

[dependencies]
arrow = { version = "60", features = ["pyarrow"] }
clap = { version = "4", features = ["derive"] }
pyo3 = { version = "0.29", features = ["extension-module"] }
rayon = "1.12"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = "2.12"
rustls = "0.23"
unicode-normalization = "0.1"
unicode-casefold = "0.2"
csv = "1.4.0"
strsim = "0.11.1"
chrono = "0.4.45"

[features]
abi3 = ["pyo3/abi3-py311"]

[dev-dependencies]
rcgen = "0.13"

[profile.dev]
debug = false
