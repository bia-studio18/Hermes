[project]
name = "hermes-er-rust"
version = "0.1.0"
description = "Rust entity-resolution methods for Hermes, exposed via PyO3"
requires-python = ">=3.11"

[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[tool.maturin]
python-source = "python"
module-name = "hermes.er.methods._native"